[project]
name = "bb-biblia"
version = "0.1.0"
description = "Bíblia via terminal para consulta"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Wanderlei Pereira", email = "devwanderlei@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []
classifiers = [
  "Environment :: Console",
  "Natural Language :: Portuguese (Brazilian)",
  "Programming Language :: Python :: 3",
]

[project.scripts]
bb = "bb.cli:run"

[project.urls]
Repository = "https://github.com/wanderlei2583/bb"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bb"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "--cov=bb --cov-report=term-missing"
