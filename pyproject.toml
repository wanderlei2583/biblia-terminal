[project]
name = "biblia"
version = "0.1.0"
description = "Bíblia via terminal para consulta"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Wanderlei Pereira", email = "devwanderlei@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []
classifiers = [
  "Environment :: Console",
  "Natural Language :: Portuguese (Brazilan)",
  "Programming language :: Python :: 3",
]

[project.scripts]
bb = "bb.cli:run"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
